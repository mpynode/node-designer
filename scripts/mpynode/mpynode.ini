# ============================================================================
# MPyNode / Node Designer -- install configuration
# ============================================================================
# This is the ONE file Node Designer needs in order to find everything else.
# It lives next to the code (this is <mpynode package>/mpynode.ini), so it is
# always locatable: if the package can be imported, this file can be read.
#
# It only POINTS at locations -- it never stores state -- so it is fine for this
# file (and the whole install) to be read-only, e.g. on a studio network share.
#
# Every setting is OPTIONAL. Everything below ships commented out, which means
# the built-in defaults apply and behaviour is identical to having no file.
#
# Resolution order for every value, most specific wins:
#     1. the environment variable       (MPYNODE_HOME, MPYNODE_PORT_CACHE, ...)
#     2. this file
#     3. the built-in default
#
# Path values support ~ and $VAR expansion. A RELATIVE path is resolved against
# the directory holding THIS file, so a self-contained checkout can stay
# portable (e.g. home = ../../.mpynode_local).
#
# Point MPYNODE_CONFIG at another .ini to use that one instead of this file.
# ============================================================================

[paths]

# The data home. Everything below defaults to living inside it.
# Built-in default: ~/.mpynode
# home = ~/.mpynode

# Individual locations. Each defaults to a subpath of `home`, so you only need
# to set one of these if you want it somewhere ELSE than under the home.
# %(home)s below refers to the `home` value set above.
#
# preferences     = %(home)s/preferences.json
# trust_store     = %(home)s/trusted.json
# typeid_pins     = %(home)s/typeid_registry.json
# port_cache      = %(home)s/port_cache
# compiled        = %(home)s/compiled


[typeid]

# Base of the MTypeId block compiled nodes are assigned from. Ids are derived
# DETERMINISTICALLY from the node's Class name (same Class -> same id, on every
# machine, with no registry file), hashed into [base, end].
#
# The default block sits in the 0x00000000-0x0007ffff range Autodesk reserves
# for internal/testing work. If you have been allocated your own block for
# plugins you distribute, set it here and recompile.
#
# base = 0x00010000
# end  = 0x0007ffff
